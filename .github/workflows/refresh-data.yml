name: Refresh Data and Deploy

on:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨3点 UTC (北京时间11点)，拉取最新数据并重新部署，不产生 git 提交
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.STARS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-stars.js
          node scripts/fetch-projects.js

      - name: Build website
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
