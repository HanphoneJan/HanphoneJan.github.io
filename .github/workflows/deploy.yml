name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.STARS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-stars.js
          node scripts/fetch-projects.js

      - name: Fetch Pyodide runtime
        # static/pyodide/ 有 12.9MB 且已 gitignore，必须在构建时下载。
        # 浏览器内跑代码功能依赖它 —— 缺了页面仍能构建，只是按钮会报加载失败。
        #
        # 算法可视化的**录制**（pnpm trace:record）也依赖它，但轨迹已经
        # 录好进 git（static/traces/*.json），构建期不需要再跑一遍 ——
        # plugins/vis-traces 只读文件。所以这一步只为浏览器运行条而存在。
        run: node scripts/fetch-pyodide.js

      - name: Build website
        run: pnpm run build

      - name: Verify Pyodide runtime is in the artifact
        # 与 refresh-data.yml 同样的护栏：构建期不需要 Pyodide（轨迹已进 git），
        # 缺了不会让 build 失败，只会让线上 /pyodide/pyodide.mjs 静默 404。
        # 见 refresh-data.yml 里 Fetch 步骤的注释。
        run: |
          if [ ! -f .vuepress/dist/pyodide/pyodide.mjs ]; then
            echo "::error::.vuepress/dist/pyodide/pyodide.mjs 不存在 —— 运行时没进构建产物，线上「▶ 运行」会 404"
            exit 1
          fi

      - name: Verify key routes are real pages
        # `pnpm build` 只保证「渲染了 N 页」，不保证这些页**挂在预期的 URL 上**。
        # 迁移时踩过一次：page.path 少了 `.html` 后缀 → 452 页全部渲染成 404，
        # 构建依然成功、Pyodide 护栏也通过，只有读者会看到「页面不存在」。
        # 这里显式挡住：首页/两个板块根/归档页都在、且不是 404 页。
        run: |
          for f in index.html docs.html code-training.html; do
            if [ ! -f ".vuepress/dist/$f" ]; then
              echo "::error::.vuepress/dist/$f 不存在 —— 路由生成有问题"
              exit 1
            fi
            if grep -q 'vp-page not-found' ".vuepress/dist/$f"; then
              echo "::error::.vuepress/dist/$f 渲染成了 404 页 —— 检查 .vuepress/paths.ts"
              exit 1
            fi
          done
          for f in service-worker.js manifest.webmanifest; do
            if [ ! -f ".vuepress/dist/$f" ]; then
              echo "::error::.vuepress/dist/$f 不存在 —— PWA 没构建出来"
              exit 1
            fi
          done
          for f in article/index.html category/index.html tag/index.html timeline/index.html; do
            if [ ! -f ".vuepress/dist/$f" ]; then
              echo "::error::归档页 .vuepress/dist/$f 不存在 —— 检查 .vuepress/theme.ts 的 plugins.blog 与 plugins/taxonomy.ts"
              exit 1
            fi
          done
          if [ ! -f ".vuepress/dist/code-training/problems/leetcode/1.html" ]; then
            echo "::error::题解页 URL 不对（应为 /code-training/problems/leetcode/1.html）"
            exit 1
          fi
          if ! grep -q 'class="home-mount"><main' .vuepress/dist/index.html; then
            echo "::error::首页没有服务端渲染内容 —— 又变回客户端挂载了？慢网络下会空白（见 .vuepress/components/HomePage.vue）"
            exit 1
          fi

      - name: Verify offline package manifest
        # 清单在 `onGenerated` 里生成，**它坏了不会让 build 失败**：页面 chunk
        # 名解析不出来时，清单里的 chunk 全是 null，读者点「缓存全部」下的是
        # 一份离线点不动的包（能读正文、站内跳转一律退化成整页重载）。
        # `pnpm test:offline` 在真实产物上验「路由表解析出的 chunk 都存在、
        # 页面覆盖率 >= 90%」，所以放在构建之后当护栏。
        run: |
          if [ ! -f .vuepress/dist/offline-manifest.json ]; then
            echo "::error::.vuepress/dist/offline-manifest.json 不存在 —— /settings.html 的离线包没有清单"
            exit 1
          fi
          pnpm test:offline

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.vuepress/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
