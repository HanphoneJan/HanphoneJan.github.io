name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.STARS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-stars.js
          node scripts/fetch-projects.js

      - name: Fetch Pyodide runtime
        # static/pyodide/ 有 12.9MB 且已 gitignore，必须在构建时下载。
        # 浏览器内跑代码功能依赖它 —— 缺了页面仍能构建，只是按钮会报加载失败。
        #
        # 算法可视化的**录制**（pnpm trace:record）也依赖它，但轨迹已经
        # 录好进 git（static/traces/*.json），构建期不需要再跑一遍 ——
        # plugins/vis-traces 只读文件。所以这一步只为浏览器运行条而存在。
        run: node scripts/fetch-pyodide.js

      - name: Build website
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
